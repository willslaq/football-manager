# Banco de confrontos fixo e estratificado (ver benchmark/src/benchmark/fixtures.py). As faixas de
# força vêm de `world_ratings` (força de setor média do 11 auto-escalado, sem vantagem de mando),
# recalculadas a cada `world_seed` — os *rótulos* dos estratos (top/bottom/clássico/...) são
# definidos aqui, congelados antes de qualquer avaliação de candidato (ver "congele antes da
# busca" no plano).

world_seed: 2026
tactical_intensity: subtle

tiers:
  # Times top-N e bottom-N por rating geral (média de ataque/defesa/meio) definem "forte"/"fraco".
  top_n: 6
  bottom_n: 6

# Clássicos conhecidos do Brasileirão — pares (home_reference, away_reference); cada um vira dois
# fixtures (mandante em cada direção). Só entram clubes presentes no dataset atual
# (src/data/brasileirao-2026) — checado em build_fixture_bank (clube ausente é ignorado com aviso).
derbies:
  - [flamengo, vasco]
  - [flamengo, fluminense]
  - [corinthians, palmeiras]
  - [corinthians, sao-paulo]
  - [gremio, internacional]
  - [atletico-mg, cruzeiro]

formations: ["4-4-2", "4-3-3", "4-2-3-1", "3-5-2", "3-4-3"]
styles: [balanced, offensive, defensive, counter, possession, direct, pressing]

# Contagem de fixtures por estrato. `similar_strength` e `formation_style_variety` escolhem pares
# adjacentes na tabela de rating (passo espaçado pra cobrir a tabela inteira, não só o topo).
strata:
  strong_home_weak_away: { count: 6 }
  weak_home_strong_away: { count: 6 }
  similar_strength: { count: 8 }
  derby: { count: 12 } # até 2x len(derbies) (as duas direções de mando)
  formation_style_variety: { count: 10 }
  substitution_scenario: { count: 4 }
